<!--
Assignment 39
Question: Build a responsive product grid with a header and sidebar using Grid.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 39 - Product Grid</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
        }

        .layout {
            display: grid;
            grid-template-areas:
                "header header"
                "sidebar main";
            grid-template-columns: 220px 1fr;
            grid-template-rows: 70px 1fr;
            min-height: 100vh;
        }

        .header {
            grid-area: header;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background-color: #1e293b;
            color: white;
        }

        .header h1 {
            font-size: 24px;
            margin: 0;
        }

        .sidebar {
            grid-area: sidebar;
            background-color: #334155;
            padding: 20px;
        }

        .sidebar h2 {
            color: white;
            font-size: 20px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 12px 0;
        }

        .sidebar a:hover {
            color: #93c5fd;
        }

        .main {
            grid-area: main;
            padding: 25px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .product-card {
            background-color: white;
            padding: 18px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
        }

        .product-image {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 130px;
            background-color: #dbeafe;
            border-radius: 8px;
            font-size: 55px;
        }

        .product-card h3 {
            font-size: 18px;
        }

        .price {
            color: #2563eb;
            font-weight: bold;
            font-size: 17px;
        }

        button {
            padding: 10px 15px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        @media (max-width: 650px) {
            .layout {
                grid-template-areas:
                    "header"
                    "sidebar"
                    "main";
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr;
            }

            .header {
                gap: 10px;
                flex-wrap: wrap;
            }

            .sidebar {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 15px;
            }

            .sidebar h2 {
                width: 100%;
                margin-bottom: 0;
            }

            .sidebar a {
                padding: 5px 0;
            }

            .main {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="layout">

        <header class="header">
            <h1>ShopZone</h1>
            <span>Welcome to our store!</span>
        </header>

        <aside class="sidebar">
            <h2>Categories</h2>
            <a href="#">All Products</a>
            <a href="#">Electronics</a>
            <a href="#">Clothing</a>
            <a href="#">Accessories</a>
        </aside>

        <main class="main">
            <h2>Our Products</h2>

            <div class="product-grid">

                <div class="product-card">
                    <div class="product-image">🎧</div>
                    <h3>Headphones</h3>
                    <p class="price">₹999</p>
                    <button>View Product</button>
                </div>

                <div class="product-card">
                    <div class="product-image">⌚</div>
                    <h3>Smart Watch</h3>
                    <p class="price">₹1,499</p>
                    <button>View Product</button>
                </div>

                <div class="product-card">
                    <div class="product-image">🎒</div>
                    <h3>Backpack</h3>
                    <p class="price">₹799</p>
                    <button>View Product</button>
                </div>

                <div class="product-card">
                    <div class="product-image">👟</div>
                    <h3>Sports Shoes</h3>
                    <p class="price">₹1,999</p>
                    <button>View Product</button>
                </div>

                <div class="product-card">
                    <div class="product-image">📷</div>
                    <h3>Camera</h3>
                    <p class="price">₹4,999</p>
                    <button>View Product</button>
                </div>

                <div class="product-card">
                    <div class="product-image">💻</div>
                    <h3>Laptop</h3>
                    <p class="price">₹39,999</p>
                    <button>View Product</button>
                </div>

            </div>
        </main>

    </div>

</body>
</html>
