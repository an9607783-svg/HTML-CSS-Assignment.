<!-- Assignment 22: Style a page using at least four different CSS selector types correctly. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 22 - CSS Selectors</title>

    <style>
        /* 1. Element Selector */
        p {
            color: blue;
        }

        /* 2. Class Selector */
        .highlight {
            background-color: yellow;
        }

        /* 3. ID Selector */
        #heading {
            color: green;
        }

        /* 4. Group Selector */
        h2, h3 {
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

    <h1 id="heading">My CSS Selectors</h1>

    <h2>Welcome to My Page</h2>

    <p>This paragraph uses an element selector.</p>

    <p class="highlight">This paragraph uses a class selector.</p>

    <h3>Learning CSS</h3>

</body>
</html>
