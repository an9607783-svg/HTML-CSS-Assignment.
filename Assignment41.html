<!-- Assignment 41: Add at least two breakpoints and test on multiple screen sizes -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 41 - Responsive Design</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        header {
            background-color: #263b5e;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 25px;
            background-color: #426b9b;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .container {
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .content, .sidebar {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
        }

        .content {
            flex: 3;
        }

        .sidebar {
            flex: 1;
        }

        /* Breakpoint 1: Tablets */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            nav {
                gap: 15px;
            }
        }

        /* Breakpoint 2: Mobile phones */
        @media (max-width: 480px) {
            header {
                padding: 12px;
            }

            nav {
                flex-direction: column;
                align-items: center;
                gap: 12px;
            }

            .container {
                padding: 10px;
            }

            .content, .sidebar {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>My Responsive Website</h1>
        <p>Assignment 41 - Responsive Design</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <div class="container">
        <main class="content">
            <h2>Main Content</h2>
            <p>This section adjusts to different screen sizes.</p>
        </main>

        <aside class="sidebar">
            <h2>Sidebar</h2>
            <p>This sidebar moves below the main content on smaller screens.</p>
        </aside>
    </div>

</body>
</html>
