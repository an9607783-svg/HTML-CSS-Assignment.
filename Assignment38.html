<!--
Assignment 38
Question: Recreate a simple dashboard layout using named grid areas.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 38 - Dashboard Layout</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
        }

        .dashboard {
            display: grid;
            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";
            grid-template-columns: 220px 1fr;
            grid-template-rows: 70px 1fr 50px;
            min-height: 100vh;
        }

        .header {
            grid-area: header;
            background-color: #1e293b;
            color: white;
            padding: 20px;
            font-size: 22px;
            font-weight: bold;
        }

        .sidebar {
            grid-area: sidebar;
            background-color: #334155;
            color: white;
            padding: 20px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 12px 0;
        }

        .sidebar a:hover {
            color: #93c5fd;
        }

        .main {
            grid-area: main;
            padding: 25px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
        }

        .card h3 {
            margin-top: 0;
            color: #64748b;
        }

        .card p {
            font-size: 25px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 0;
        }

        .footer {
            grid-area: footer;
            background-color: #e2e8f0;
            text-align: center;
            padding: 16px;
        }

        @media (max-width: 600px) {
            .dashboard {
                grid-template-areas:
                    "header"
                    "sidebar"
                    "main"
                    "footer";
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr auto;
            }

            .sidebar {
                display: flex;
                flex-wrap: wrap;
                gap: 15px;
            }

            .sidebar a {
                padding: 5px 0;
            }

            .main {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <header class="header">
            My Dashboard
        </header>

        <aside class="sidebar">
            <a href="#">Home</a>
            <a href="#">Analytics</a>
            <a href="#">Reports</a>
            <a href="#">Settings</a>
        </aside>

        <main class="main">
            <h1>Dashboard Overview</h1>
            <p>Welcome to your dashboard. Here is a summary of your activity.</p>

            <div class="cards">
                <div class="card">
                    <h3>Total Users</h3>
                    <p>1,250</p>
                </div>

                <div class="card">
                    <h3>Revenue</h3>
                    <p>₹25,000</p>
                </div>

                <div class="card">
                    <h3>Orders</h3>
                    <p>320</p>
                </div>

                <div class="card">
                    <h3>Visitors</h3>
                    <p>4,580</p>
                </div>
            </div>
        </main>

        <footer class="footer">
            © 2026 My Dashboard
        </footer>

    </div>

</body>
</html>
