<!-- Question 16: Create a student-registration form using basic input types. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>

    <header>
        <h1>Student Registration Form</h1>
        <p>Please fill in your details below.</p>
    </header>

    <main>
        <form action="#" method="get">

            <fieldset>
                <legend>Personal Information</legend>

                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname"
                       placeholder="Enter your full name" required>
                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>
                <br><br>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password"
                       required>
                <br><br>

                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>
                <br><br>

                <p>Gender:</p>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>

                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>

                <input type="radio" id="other" name="gender" value="other">
                <label for="other">Other</label>
                <br><br>
            </fieldset>

            <br>

            <fieldset>
                <legend>Course Information</legend>

                <label for="course">Select Course:</label>
                <select id="course" name="course" required>
                    <option value="">Choose a course</option>
                    <option value="bca-ai">BCA Artificial Intelligence</option>
                    <option value="bca">BCA</option>
                    <option value="bba">BBA</option>
                    <option value="btech">B.Tech</option>
                </select>
                <br><br>

                <label for="section">Section:</label>
                <input type="text" id="section" name="section"
                       value="C">
                <br><br>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone"
                       placeholder="Enter phone number">
                <br><br>

                <label for="address">Address:</label>
                <textarea id="address" name="address" rows="4" cols="30"
                          placeholder="Enter your address"></textarea>
                <br><br>

                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I confirm that the information is correct.</label>
                <br><br>
            </fieldset>

            <br>

            <button type="submit">Register</button>
            <button type="reset">Clear Form</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Ayesha Nasir</p>
    </footer>

</body>
</html>
