<!-- Assignment 42: Audit and fix responsiveness issues in an earlier project -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 42 - Responsive Layout Fix</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #243b55;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            background-color: #426b9b;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .container {
            display: flex;
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: auto;
        }

        main {
            flex: 2;
            min-width: 0;
            background-color: #f2f2f2;
            padding: 20px;
        }

        aside {
            flex: 1;
            min-width: 0;
            background-color: #e0e7ef;
            padding: 20px;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        /* Fix for tablets */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                padding: 15px;
            }
        }

        /* Fix for mobile phones */
        @media (max-width: 480px) {
            header {
                padding: 12px;
            }

            nav {
                flex-direction: column;
                align-items: center;
                gap: 12px;
            }

            .container {
                padding: 10px;
                gap: 10px;
            }

            main, aside {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Responsive Layout</h1>
        <p>Assignment 42 - Fixing Responsiveness</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <div class="container">
        <main>
            <h2>Main Content</h2>
            <p>This layout adjusts to smaller screens without horizontal scrolling.</p>
            <img src="https://placehold.co/600x250" alt="Sample landscape placeholder">
        </main>

        <aside>
            <h2>Sidebar</h2>
            <p>The sidebar moves below the main content on smaller screens.</p>
        </aside>
    </div>

</body>
</html>
