<!-- Question 21: Convert an HTML-only page into a styled page. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 21 - Basic CSS Styling</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            color: #333333;
            margin: 0;
            padding: 20px;
        }

        header {
            background-color: #2457a7;
            color: white;
            text-align: center;
            padding: 20px;
        }

        main {
            background-color: white;
            padding: 20px;
            margin: 20px auto;
            max-width: 700px;
            border-radius: 8px;
        }

        h2 {
            color: #2457a7;
        }

        footer {
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Webpage</h1>
        <p>Assignment 21: Basic CSS Styling</p>
    </header>

    <main>
        <h2>About Me</h2>
        <p>My name is Ayesha Nasir. I am a first-year BCA Artificial Intelligence student at Invertis University, Bareilly, Section C.</p>

        <h2>My Skills</h2>
        <ul>
            <li>HTML</li>
            <li>Learning CSS</li>
            <li>Learning Java</li>
            <li>Learning C++</li>
        </ul>
    </main>

    <footer>
        <p>&copy; 2026 Ayesha Nasir</p>
    </footer>

</body>
</html>
