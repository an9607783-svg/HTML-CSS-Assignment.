<!--
Assignment 29
Question: Style a landing-page hero section using position and z-index.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 29 - Hero Section</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .hero {
            position: relative;
            min-height: 400px;
            background-color: #dbeafe;
            padding: 80px 30px;
            overflow: hidden;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 550px;
        }

        h1 {
            color: #1e3a8a;
            font-size: 42px;
            margin-bottom: 15px;
        }

        p {
            color: #333;
            font-size: 18px;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            padding: 12px 24px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .circle {
            position: absolute;
            width: 250px;
            height: 250px;
            background-color: #93c5fd;
            border-radius: 50%;
            right: 60px;
            top: 70px;
            z-index: 1;
        }

        @media (max-width: 600px) {
            .hero {
                padding: 50px 20px;
            }

            h1 {
                font-size: 32px;
            }

            .circle {
                right: -100px;
                top: 180px;
            }
        }
    </style>
</head>

<body>

    <section class="hero">
        <div class="circle"></div>

        <div class="hero-content">
            <h1>Welcome to Our Website</h1>

            <p>
                Discover new opportunities and explore our services.
                We help you turn your ideas into reality.
            </p>

            <a href="#" class="button">Get Started</a>
        </div>
    </section>

</body>
</html>
