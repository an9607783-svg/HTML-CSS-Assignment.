<!-- Question 17: Build a job-application form using different HTML input types. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
</head>
<body>

    <header>
        <h1>Job Application Form</h1>
        <p>Fill in the details to apply for a position.</p>
    </header>

    <main>
        <form action="#" method="get">

            <fieldset>
                <legend>Personal Details</legend>

                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>
                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <br><br>

                <label for="password">Create Password:</label>
                <input type="password" id="password" name="password" required>
                <br><br>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone">
                <br><br>

                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob">
                <br><br>

                <label for="interview-time">Preferred Interview Time:</label>
                <input type="time" id="interview-time" name="interview-time">
                <br><br>

                <label for="website">Portfolio Website:</label>
                <input type="url" id="website" name="website"
                       placeholder="https://example.com">
                <br><br>

                <label for="experience">Years of Experience:</label>
                <input type="number" id="experience" name="experience"
                       min="0" max="50" value="0">
                <br><br>
            </fieldset>

            <br>

            <fieldset>
                <legend>Job Preferences</legend>

                <p>Preferred Work Mode:</p>
                <input type="radio" id="remote" name="workmode" value="remote">
                <label for="remote">Remote</label>

                <input type="radio" id="office" name="workmode" value="office">
                <label for="office">Office</label>

                <input type="radio" id="hybrid" name="workmode" value="hybrid">
                <label for="hybrid">Hybrid</label>
                <br><br>

                <label for="position">Choose Position:</label>
                <select id="position" name="position" required>
                    <option value="">Select a position</option>
                    <option value="web-developer">Web Developer Intern</option>
                    <option value="software-developer">Software Developer Intern</option>
                    <option value="ai-intern">AI Intern</option>
                </select>
                <br><br>

                <label for="skills">Skill Level (1 to 10):</label>
                <input type="range" id="skills" name="skills"
                       min="1" max="10" value="5">
                <br><br>

                <label for="color">Choose a preferred theme colour:</label>
                <input type="color" id="color" name="color" value="#3366cc">
                <br><br>

                <label for="resume">Upload Resume:</label>
                <input type="file" id="resume" name="resume">
                <br><br>

                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I confirm that the information is correct.</label>
                <br><br>
            </fieldset>

            <br>

            <label for="message">Why should we hire you?</label>
            <br>
            <textarea id="message" name="message" rows="5" cols="40"
                      placeholder="Write a short introduction"></textarea>
            <br><br>

            <input type="hidden" name="form-type" value="job-application">

            <button type="submit">Submit Application</button>
            <button type="reset">Clear Form</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Ayesha Nasir</p>
    </footer>

</body>
</html>
