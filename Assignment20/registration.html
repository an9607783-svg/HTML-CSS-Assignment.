<!-- Question 20: Student registration page -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Student registration form.">
    <title>Registration | Ayesha's Website</title>
</head>
<body>

    <header>
        <h1>Student Registration</h1>

        <nav>
            <a href="index.html">Home</a> |
            <a href="about.html">About</a> |
            <a href="registration.html">Registration</a> |
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Registration Form</h2>

        <form>
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="course">Select Course:</label>
            <select id="course" name="course">
                <option value="BCA AI">BCA Artificial Intelligence</option>
                <option value="BCA">BCA</option>
                <option value="BBA">BBA</option>
            </select>
            <br><br>

            <button type="submit">Register</button>
            <button type="reset">Clear</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Ayesha Nasir</p>
    </footer>

</body>
</html>
