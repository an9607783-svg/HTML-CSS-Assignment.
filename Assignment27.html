<!--
Assignment 27: Create three differently styled card variants using border-radius and backgrounds.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 27 - Card Designs</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            padding: 20px;
        }

        .card {
            width: 250px;
            padding: 20px;
            margin: 20px auto;
            background-color: white;
        }

        .card1 {
            border-radius: 5px;
            border: 2px solid blue;
        }

        .card2 {
            border-radius: 20px;
            background-color: lightblue;
        }

        .card3 {
            border-radius: 50px;
            background-color: lightpink;
            border: 2px solid purple;
        }
    </style>
</head>
<body>

    <h1>Three Different Card Designs</h1>

    <div class="card card1">
        <h2>Card One</h2>
        <p>This card has slightly rounded corners.</p>
    </div>

    <div class="card card2">
        <h2>Card Two</h2>
        <p>This card has rounded corners and a blue background.</p>
    </div>

    <div class="card card3">
        <h2>Card Three</h2>
        <p>This card has very rounded corners and a pink background.</p>
    </div>

</body>
</html>
