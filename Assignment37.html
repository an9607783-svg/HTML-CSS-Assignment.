<!--
Assignment 37
Question: Build a responsive product grid that reflows automatically.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 37 - Responsive Product Grid</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
        }

        h1 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 30px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .product-card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .product-image {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 150px;
            background-color: #dbeafe;
            border-radius: 8px;
            font-size: 60px;
        }

        h2 {
            color: #334155;
            font-size: 20px;
        }

        .price {
            color: #2563eb;
            font-size: 18px;
            font-weight: bold;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            background-color: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>

    <h1>Our Products</h1>

    <div class="product-grid">

        <div class="product-card">
            <div class="product-image">🎧</div>
            <h2>Headphones</h2>
            <p class="price">₹999</p>
            <button>View Product</button>
        </div>

        <div class="product-card">
            <div class="product-image">⌚</div>
            <h2>Smart Watch</h2>
            <p class="price">₹1,499</p>
            <button>View Product</button>
        </div>

        <div class="product-card">
            <div class="product-image">🎒</div>
            <h2>Backpack</h2>
            <p class="price">₹799</p>
            <button>View Product</button>
        </div>

        <div class="product-card">
            <div class="product-image">👟</div>
            <h2>Sports Shoes</h2>
            <p class="price">₹1,999</p>
            <button>View Product</button>
        </div>

        <div class="product-card">
            <div class="product-image">📷</div>
            <h2>Camera</h2>
            <p class="price">₹4,999</p>
            <button>View Product</button>
        </div>

        <div class="product-card">
            <div class="product-image">💻</div>
            <h2>Laptop</h2>
            <p class="price">₹39,999</p>
            <button>View Product</button>
        </div>

    </div>

</body>
</html>
