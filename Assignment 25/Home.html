<!-- Assignment 25: Styled Multi-Page Project - Home Page -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | My College Website</title>

    <style>
        :root {
            --primary: #17365d;
            --secondary: #287271;
            --background: #f0f4f8;
            --text: #333333;
            --heading-size: 30px;
            --body-size: 16px;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--background);
            color: var(--text);
            font-size: var(--body-size);
            line-height: 1.6;
            margin: 0;
        }

        header {
            background: var(--primary);
            color: white;
            padding: 25px;
            text-align: center;
        }

        h1 {
            font-size: var(--heading-size);
        }

        nav {
            background: var(--secondary);
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 12px;
        }

        main {
            max-width: 800px;
            margin: 25px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
        }

        footer {
            text-align: center;
            padding: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My College Website</h1>
        <p>Learn, Grow and Achieve</p>
    </header>

    <nav>
        <a href="Home.html">Home</a>
        <a href="About.html">About</a>

    <main>
        <h2>Welcome!</h2>

    </main>

    <footer>
        <p>My College Website | Assignment 25</p>
    </footer>

</body>
</html>
