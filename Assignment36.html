<!--
Assignment 36
Question: Build a simple photo gallery using CSS Grid.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 36 - Photo Gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
        }

        h1 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .gallery img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
        }

        @media (max-width: 700px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 450px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">
        <img src="https://picsum.photos/id/1015/400/300" alt="Mountain landscape">
        <img src="https://picsum.photos/id/1016/400/300" alt="Nature landscape">
        <img src="https://picsum.photos/id/1018/400/300" alt="Green mountain">
        <img src="https://picsum.photos/id/1020/400/300" alt="Forest landscape">
        <img src="https://picsum.photos/id/1039/400/300" alt="River and mountains">
        <img src="https://picsum.photos/id/1043/400/300" alt="Beautiful nature">
    </div>

</body>
</html>
